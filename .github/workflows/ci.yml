name: CI

on:
  push:
  pull_request:

# Avoid duplicate runs when a branch is updated repeatedly.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; CI only checks out code and runs local scripts.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, format, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Node 22 is an LTS release compatible with the Vite 6 / Vitest 3 toolchain.
      # npm cache is keyed automatically from package-lock.json.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
